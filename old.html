<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Games</title>
<style>
:root{color-scheme:dark;--bg:#101010;--panel:#171717;--line:#303030;--muted:#a0a0a0;--text:#f2f2f2;--accent:#d6ff67}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font:14px/1.45 Arial,Helvetica,sans-serif;min-height:100vh}
header,main{max-width:1280px;margin:auto;padding-left:24px;padding-right:24px}
header{padding-top:18px;padding-bottom:12px}
.eyebrow{font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);font-weight:700}
h1{font-size:30px;letter-spacing:-.04em;margin:5px 0;font-weight:700}
.sub{color:var(--muted);margin:0;font-size:13px}
.toolbar{display:flex;gap:8px;flex-wrap:wrap;margin-top:0}
input,select{background:#171717;border:1px solid #333;border-radius:5px;padding:10px 12px;color:var(--text);font:inherit;outline:none}
input{flex:1;min-width:200px}input:focus,select:focus{border-color:#777}
.count{display:flex;justify-content:space-between;align-items:center;color:var(--muted);font-size:11px;margin:8px 0 14px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(135px,1fr));gap:16px}
.game{appearance:none;border:0;background:transparent;color:inherit;text-align:left;padding:0;cursor:pointer;min-width:0;transition:opacity .15s}
.game:hover{opacity:.82}.game:focus-visible{outline:1px solid var(--accent);outline-offset:4px}
.cover{position:relative;aspect-ratio:3/4;overflow:hidden;border-radius:4px;background:#202020;border:1px solid #303030}
.cover img{display:block;width:100%;height:100%;object-fit:cover}.art-fallback{height:100%;display:flex;align-items:center;justify-content:center;padding:12px;text-align:center;color:#aaa;font-size:13px;background:#202020}
.tag{position:absolute;top:7px;left:7px;padding:3px 5px;background:#111e;color:#eee;border-radius:2px;font-size:9px;text-transform:uppercase}
.gtitle{font-size:13px;font-weight:700;margin:8px 1px 2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.genre{font-size:11px;color:var(--muted);margin:0 1px}
.empty{display:none;color:var(--muted);padding:40px 0;text-align:center}
.overlay{position:fixed;inset:0;z-index:10;background:#000c;display:none;align-items:center;justify-content:center;padding:16px}
.overlay.open{display:flex}
.dialog{width:min(720px,100%);max-height:94vh;overflow:auto;background:#151515;border:1px solid #383838;border-radius:7px}
.detail{display:grid;grid-template-columns:150px 1fr;gap:20px;padding:20px}
.detail img{width:100%;aspect-ratio:3/4;object-fit:cover;border-radius:3px;background:#222;border:1px solid #333}.detail .art-fallback{aspect-ratio:3/4;border-radius:3px}
.close{float:right;border:1px solid #444;background:transparent;color:#eee;border-radius:3px;width:30px;height:30px;cursor:pointer;font-size:18px}
.detail h2{font-size:24px;letter-spacing:-.03em;line-height:1.15;margin:10px 0 8px}
.pills{display:flex;gap:6px;flex-wrap:wrap;margin:10px 0}
.pill{font-size:11px;border:1px solid #3a3a3a;color:#ccc;border-radius:3px;padding:4px 7px}
.description{color:#c0c0c0;font-size:13px;line-height:1.6}
.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:16px}
.btn{border:1px solid #444;border-radius:4px;padding:9px 13px;font:inherit;font-size:12px;font-weight:700;cursor:pointer;text-decoration:none;display:inline-flex;align-items:center;justify-content:center}
.primary{background:var(--accent);color:#111;border-color:var(--accent)}.secondary{background:#202020;color:#f5f5f5}
.player{display:none;border-top:1px solid #333;background:#050505}.player.show{display:block}
.playerbar{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:10px 14px;color:#ccc;font-size:12px}
.playerbar a{color:var(--accent);text-decoration:none}
iframe{display:block;width:100%;height:min(70vh,650px);border:0;background:#000}
.notice{font-size:11px;color:#888;padding:0 14px 12px}
.tab-options{display:flex;gap:7px;flex-wrap:wrap;margin-top:9px}
.tab-options[hidden]{display:none}
.player:fullscreen{width:100vw;height:100vh;border:0;display:flex;flex-direction:column}
.player:fullscreen iframe{height:auto;flex:1;min-height:0}
.player:fullscreen .playerbar{flex-shrink:0}

@media(max-width:560px){header{padding-top:22px}header,main{padding-left:14px;padding-right:14px}.grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:13px}.detail{grid-template-columns:90px 1fr;padding:13px;gap:13px}.detail h2{font-size:20px}.overlay{padding:7px}}
</style>
</head>
<body>
<header>
  <div class="toolbar">
    <input id="search" type="search" placeholder="Search games..." aria-label="Search games">
    <select id="filter" aria-label="Filter by genre">
      <option value="all">All genres</option><option>FPS</option><option>Zombies</option><option>Skating</option><option>Sports</option><option>Action</option><option>Platformer</option><option>Strategy</option><option>Sandbox</option>
    </select>
  </div>
</header>
<main>
  <section class="grid" id="grid" aria-label="Game catalogue"></section>
  <div class="empty" id="empty">No games match that search.</div>
</main>
<div class="overlay" id="overlay" role="dialog" aria-modal="true" aria-label="Game details">
  <div class="dialog">
    <div class="detail">
      <img id="detailImg" alt="">
      <div>
        <button class="close" id="close" aria-label="Close game card">×</button>
        <div class="eyebrow" id="detailType">GAME</div>
        <h2 id="detailTitle"></h2>
        <div class="pills"><span class="pill" id="detailGenre"></span><span class="pill" id="detailMode"></span></div>
        <p class="description" id="detailDesc"></p>
        <div class="actions">
          <button class="btn primary" id="play">▶ Play</button>
          <button class="btn secondary" id="openNewTab">Open in new tab ↗</button>
        </div>
        <div class="tab-options" id="tabOptions" hidden>
          <button class="btn secondary" id="openDirect">Open the site</button>
          <button class="btn secondary" id="openBlankFrame">Open about:blank + iframe</button>
        </div>
      </div>
    </div>
    <div class="player" id="player">
      <div class="playerbar"><span id="playerTitle">Now playing</span><div style="display:flex;gap:6px;flex-wrap:wrap"><button class="btn secondary" id="fullscreen" style="padding:6px 10px">Fullscreen ⛶</button><button class="btn secondary" id="stop" style="padding:6px 10px">Close player</button></div></div>
      <iframe id="frame" title="Embedded game" allow="autoplay; fullscreen; gamepad; clipboard-read; clipboard-write" allowfullscreen referrerpolicy="strict-origin-when-cross-origin"></iframe>
      <div class="notice">If the game does not load here, the host may block iframe embedding. Try “Open site” above.</div>
    </div>
  </div>
</div>
<script>
const games = [
 {name:"BO1 Zombies",url:"https://vel.gg/bo1z",genre:"Zombies",mode:"Survival",type:"Call of Duty",desc:"Survive waves of the undead, earn points, unlock areas, and see how long you can last.",imgs:["https://static.wikia.nocookie.net/callofduty/images/4/40/BlackOps_Zombies_BoxArt.jpg/revision/latest?cb=20260324041605","https://cdn.cloudflare.steamstatic.com/steam/apps/42700/header.jpg"]},
 {name:"BO3 Cheese Cube",url:"https://cheese-cube.pages.dev",genre:"Zombies",mode:"Challenge",type:"Call of Duty",desc:"A compact, challenge-style Zombies experience built around the Cheese Cube map.",imgs:["https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcRxOv7KlBQsY435cJOlC4gOYAyTaJEhqg1X_Z98hUkOtFxvvy90-wOEcE0&s=10","https://cdn.cloudflare.steamstatic.com/steam/apps/311210/header.jpg"]},
 {name:"Black Ops 2",url:"https://vibeslops.luckeysystems.com",genre:"FPS",mode:"Shooter",type:"Call of Duty",desc:"A browser-hosted take on the fast-paced Call of Duty: Black Ops II experience.",imgs:["https://upload.wikimedia.org/wikipedia/en/0/05/Call_of_Duty_Black_Ops_II_box_artwork.png","https://cdn.cloudflare.steamstatic.com/steam/apps/202990/header.jpg"]},
 {name:"Modern Warfare 2",url:"https://ovz-game-production.up.railway.app",genre:"FPS",mode:"Shooter",type:"Call of Duty",desc:"A browser-playable shooter inspired by the Modern Warfare series.",imgs:["https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcQwotCszm-PgG_vYfOB4JE0NQAzOvfGz4gQlxr1SVnUcrxfP97avP988pGf&s=10","https://cdn.cloudflare.steamstatic.com/steam/apps/10180/header.jpg"]},
 {name:"Skate 3",url:"https://skate.aaddpp.lol",genre:"Skating",mode:"Sports",type:"Skateboarding",desc:"Land tricks, chain combos, and cruise around a skateboarding playground.",imgs:["https://static.wikia.nocookie.net/skate/images/7/7d/Skate_3.jpg/revision/latest?cb=20220715005550"]},
 {name:"Skate Rust",url:"https://global-terror.net",genre:"Skating",mode:"Multiplayer",type:"Skating",desc:"A skate-themed browser experience. Check the host page for its available modes.",imgs:["https://i.ytimg.com/vi/osiMnevjhZM/hqdefault.jpg","https://static.wikia.nocookie.net/skate/images/7/7d/Skate_3.jpg/revision/latest?cb=20220715005550"]},
 {name:"CS Surf",url:"https://surfd.net",genre:"FPS",mode:"Movement",type:"Counter-Strike",desc:"Surf custom ramps, build speed, and practice smooth movement through obstacle courses.",imgs:["https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcSV12txDx4wawqXgX1Cuy4_5QxebjxpsJ6_hvv-nSPjaOt1kpPfP-lsYIo&s=10","https://cdn.cloudflare.steamstatic.com/steam/apps/10/header.jpg"]},
 {name:"Halo CE",url:"https://mitchellhynes.com/halo",genre:"FPS",mode:"Sci-fi shooter",type:"Halo",desc:"A classic sci-fi shooter featuring alien worlds, human weapons, and intense combat.",imgs:["https://upload.wikimedia.org/wikipedia/en/8/80/Halo_-_Combat_Evolved_%28XBox_version_-_box_art%29.jpg","https://cdn.cloudflare.steamstatic.com/steam/apps/1064220/header.jpg"]},
 {name:"Halo CE Mobile",url:"https://hcemobile.com",genre:"FPS",mode:"Mobile-friendly",type:"Halo",desc:"A mobile-focused Halo CE browser experience. Controls may vary by device.",imgs:["https://upload.wikimedia.org/wikipedia/en/8/80/Halo_-_Combat_Evolved_%28XBox_version_-_box_art%29.jpg","https://cdn.cloudflare.steamstatic.com/steam/apps/1064220/header.jpg"]},
 {name:"PES 6",url:"https://pes6.optijuegos.net",genre:"Sports",mode:"Soccer",type:"Football",desc:"Classic football gameplay with teams, passing, shooting, and match-day action.",imgs:["https://static.wikia.nocookie.net/pes/images/f/f2/Pes_6_poster_SWE.jpg/revision/latest/scale-to-width-down/250?cb=20251019193802"]},
 {name:"GTA 5",url:"https://playgta5.com/",genre:"Action",mode:"Open world",type:"Grand Theft Auto",desc:"An open-world crime and driving experience. The archive URL supplied was incomplete, so this uses the original playgta5.com address.",imgs:["https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcRUIGXYO4il51ecid-3Lnh9JtkXz_hc2lH3cHa7lA2pkg&s=10","https://cdn.cloudflare.steamstatic.com/steam/apps/271590/header.jpg"]},
 {name:"GTA Vice City",url:"https://joncodeofficial.github.io/gta-vice-city-wasm",genre:"Action",mode:"Open world",type:"Grand Theft Auto",desc:"Explore a neon-soaked city, drive around, and take on missions in this classic open-world setting.",imgs:["https://i.pinimg.com/236x/d5/b3/74/d5b37447d1ef23deaa62f117359ac5a5.jpg","https://cdn.cloudflare.steamstatic.com/steam/apps/12110/header.jpg"]},
 {name:"The Simpsons: Hit & Run",url:"https://shar-wasm.cjoseph.workers.dev/?skipmovie",genre:"Action",mode:"Driving / adventure",type:"Platformer",desc:"Race around Springfield, complete missions, and explore a cartoon-styled town.",imgs:["https://upload.wikimedia.org/wikipedia/en/5/5f/The_Simpsons_Hit_and_Run_cover.png"]},
 {name:"Quake 1",url:"https://q1.pieter.com",genre:"FPS",mode:"Arena shooter",type:"Quake",desc:"A landmark dark-fantasy shooter packed with secret rooms, monsters, and fast combat.",imgs:["https://commons.wikimedia.org/wiki/Special:FilePath/Quake_cover.png","https://cdn.cloudflare.steamstatic.com/steam/apps/2310/header.jpg"]},
 {name:"Quake 2",url:"https://q2.pieter.com",genre:"FPS",mode:"Sci-fi shooter",type:"Quake",desc:"Battle the Strogg in a classic sci-fi first-person shooter.",imgs:["https://cdn.cloudflare.steamstatic.com/steam/apps/2320/header.jpg","https://shared.akamai.steamstatic.com/store_item_assets/steam/apps/2320/library_600x900.jpg"]},
 {name:"Quake 3",url:"https://q3.pieter.com",genre:"FPS",mode:"Arena shooter",type:"Quake",desc:"Fast arena combat focused on movement, aim, weapons, and multiplayer-style duels.",imgs:["https://cdn.cloudflare.steamstatic.com/steam/apps/2200/header.jpg","https://shared.akamai.steamstatic.com/store_item_assets/steam/apps/2200/library_600x900.jpg"]},
 {name:"Return to Castle Wolfenstein",url:"https://rtcw.pieter.com",genre:"FPS",mode:"Action shooter",type:"Wolfenstein",desc:"A WWII-era shooter with secret facilities, enemy soldiers, and supernatural threats.",imgs:["https://en.wikipedia.org/wiki/Special:FilePath/Return_to_Castle_Wolfenstein_Coverart.jpg","https://cdn.cloudflare.steamstatic.com/steam/apps/9010/header.jpg"]},
 {name:"Unreal Tournament",url:"https://ut.pieter.com",genre:"FPS",mode:"Arena shooter",type:"Unreal",desc:"High-speed arena combat with varied weapons, movement, and classic multiplayer maps.",imgs:["https://en.wikipedia.org/wiki/Special:FilePath/Unreal_Tournament_cover.jpg","https://cdn.cloudflare.steamstatic.com/steam/apps/13210/header.jpg"]},
 {name:"Half-Life",url:"https://pixelsuft.github.io/hl/",genre:"FPS",mode:"Story shooter",type:"Half-Life",desc:"Escape a research facility gone wrong in a story-driven science-fiction shooter.",imgs:["https://cdn.cloudflare.steamstatic.com/steam/apps/70/header.jpg","https://commons.wikimedia.org/wiki/Special:FilePath/Half-Life.png"]},
 {name:"Half-Life / CS 1.6",url:"https://x8bitrain.github.io/webXash/",genre:"FPS",mode:"Classic shooter",type:"Xash3D",desc:"A browser engine for classic GoldSrc-style games, including Half-Life and Counter-Strike content.",imgs:["https://cdn.cloudflare.steamstatic.com/steam/apps/10/header.jpg","https://cdn.cloudflare.steamstatic.com/steam/apps/70/header.jpg"]},
 {name:"Diablo",url:"https://johnimril.github.io/diablo_web/",genre:"Action",mode:"Action RPG",type:"Role-playing",desc:"Descend into a dark dungeon, battle monsters, and gather loot in a classic action RPG.",imgs:["https://en.wikipedia.org/wiki/Special:FilePath/Diablo_box_art.jpg"]},
 {name:"Hedgewars",url:"https://webwars.link",genre:"Strategy",mode:"Turn-based",type:"Artillery strategy",desc:"A playful turn-based artillery game where teams take turns using weapons across destructible terrain.",imgs:["https://cdn.cloudflare.steamstatic.com/steam/apps/2223810/header.jpg","https://commons.wikimedia.org/wiki/Special:FilePath/Hedgewars.png"]},
 {name:"More GTA / Minecraft",url:"https://wasmarcade.com/Fan",genre:"Sandbox",mode:"Collection",type:"Arcade collection",desc:"A collection page for additional browser-based GTA and Minecraft-style experiences.",imgs:["https://upload.wikimedia.org/wikipedia/en/5/51/Minecraft_cover.png","https://cdn.cloudflare.steamstatic.com/steam/apps/271590/header.jpg"]}
];
const grid=document.getElementById("grid"),search=document.getElementById("search"),filter=document.getElementById("filter");
const overlay=document.getElementById("overlay"),player=document.getElementById("player"),frame=document.getElementById("frame");
let active=null;
function useArt(img, g){
 const sources = g.imgs || [];
 let i = 0;
 img.onerror = () => {
   i++;
   if(i < sources.length){ img.src = sources[i]; return; }
   img.onerror = null;
   const svg = '<svg xmlns="http://www.w3.org/2000/svg" width="500" height="700"><rect width="100%" height="100%" fill="#202020"/><text x="50%" y="50%" fill="#aaa" font-family="Arial,sans-serif" font-size="26" text-anchor="middle" dominant-baseline="middle">' + g.name.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;") + '</text></svg>';
   img.src = "data:image/svg+xml;charset=UTF-8," + encodeURIComponent(svg);
 };
 img.src = sources[0] || "";
}
function makeCard(g){
 const b=document.createElement("button");b.className="game";b.type="button";
 const cover=document.createElement("div");cover.className="cover";
 const img=document.createElement("img");img.loading="lazy";img.alt=g.name+" cover art";
 useArt(img,g);
 const tag=document.createElement("span");tag.className="tag";tag.textContent=g.genre;
 cover.append(img,tag);
 const title=document.createElement("div");title.className="gtitle";title.textContent=g.name;
 const genre=document.createElement("p");genre.className="genre";genre.textContent=g.mode;
 b.append(cover,title,genre);b.addEventListener("click",()=>openDetails(g));return b;
}
function render(){
 grid.innerHTML="";const q=search.value.trim().toLowerCase(),f=filter.value;
 const list=games.filter(g=>(g.name+" "+g.genre+" "+g.type+" "+g.mode).toLowerCase().includes(q)&&(f==="all"||g.genre===f));
 list.forEach(g=>grid.appendChild(makeCard(g)));
 document.getElementById("empty").style.display=list.length?"none":"block";
}
function openDetails(g){
 active=g;player.classList.remove("show");frame.src="about:blank";
 const detailImg=document.getElementById("detailImg");detailImg.alt=g.name+" cover art";useArt(detailImg,g);
 document.getElementById("detailType").textContent=g.type;document.getElementById("detailTitle").textContent=g.name;
 document.getElementById("detailGenre").textContent=g.genre;document.getElementById("detailMode").textContent=g.mode;
 document.getElementById("detailDesc").textContent=g.desc;
 document.getElementById("tabOptions").hidden=true;
 document.getElementById("playerTitle").textContent="Playing: "+g.name;
 overlay.classList.add("open");document.body.style.overflow="hidden";
}
function closeDetails(){overlay.classList.remove("open");document.body.style.overflow="";frame.src="about:blank";player.classList.remove("show");active=null}
async function enterFullscreen(){
 try{
   if(player.requestFullscreen) await player.requestFullscreen();
   else if(frame.requestFullscreen) await frame.requestFullscreen();
 }catch(err){
   // Some browsers or embedded contexts disallow fullscreen; the player still opens normally.
 }
}
document.getElementById("play").addEventListener("click",()=>{
 if(!active)return;
 frame.src=active.url;
 player.classList.add("show");
 player.scrollIntoView({behavior:"smooth",block:"nearest"});
 // Fullscreen is requested from the user's click; browsers may still deny it.
 enterFullscreen();
});
document.getElementById("fullscreen").addEventListener("click",enterFullscreen);
document.getElementById("stop").addEventListener("click",()=>{
 frame.src="about:blank";
 player.classList.remove("show");
 if(document.fullscreenElement) document.exitFullscreen().catch(()=>{});
});
document.getElementById("openNewTab").addEventListener("click",()=>{
 const options=document.getElementById("tabOptions");
 options.hidden=!options.hidden;
});
document.getElementById("openDirect").addEventListener("click",()=>{
 if(!active)return;
 window.open(active.url,"_blank","noopener,noreferrer");
 document.getElementById("tabOptions").hidden=true;
});
document.getElementById("openBlankFrame").addEventListener("click",()=>{
 if(!active)return;
 const tab=window.open("about:blank","_blank");
 if(tab){
   const safeUrl=active.url.replace(/&/g,"&amp;").replace(/"/g,"&quot;").replace(/</g,"&lt;");
   const safeTitle=active.name.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");
   tab.document.open();
   tab.document.write('<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>'+safeTitle+'</title><style>*{box-sizing:border-box}html,body,iframe{width:100%;height:100%;margin:0;border:0;background:#000;overflow:hidden}</style></head><body><iframe src="'+safeUrl+'" allow="autoplay; fullscreen; gamepad; clipboard-read; clipboard-write" allowfullscreen></iframe></body></html>');
   tab.document.close();
 }
 document.getElementById("tabOptions").hidden=true;
});
document.getElementById("close").addEventListener("click",closeDetails);
overlay.addEventListener("click",e=>{if(e.target===overlay)closeDetails()});
document.addEventListener("keydown",e=>{if(e.key==="Escape")closeDetails()});
search.addEventListener("input",render);filter.addEventListener("change",render);
render();
</script>
</body>
</html>
